name: Commit Build module

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool autopoint gettext pkg-config

      - name: Restore signing keys
        env:
          MODULE_PRIVATE_KEY_BASE64: ${{ secrets.MODULE_PRIVATE_KEY_BASE64 }}
          MODULE_PUBLIC_KEY_BASE64: ${{ secrets.MODULE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "${MODULE_PRIVATE_KEY_BASE64:-}" ]; then
            printf '%s' "$MODULE_PRIVATE_KEY_BASE64" | base64 --decode > module/private_key
            chmod 600 module/private_key
          fi

          if [ -n "${MODULE_PUBLIC_KEY_BASE64:-}" ]; then
            printf '%s' "$MODULE_PUBLIC_KEY_BASE64" | base64 --decode > module/public_key
            chmod 600 module/public_key
          fi

          if [ -f module/private_key ] && [ ! -f module/public_key ]; then
            echo "::warning::private_key restored but public_key is missing, build will fall back to unsigned output"
          fi

      - name: Build release zip
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew module:zipRelease

      - name: Upload zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}_${{ github.sha }}_release
          path: module/build/outputs/release/*.zip
          if-no-files-found: error
