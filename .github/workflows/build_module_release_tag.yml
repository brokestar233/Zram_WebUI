name: Build module release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool autopoint gettext pkg-config

      - name: Restore signing keys
        env:
          MODULE_PRIVATE_KEY_BASE64: ${{ secrets.MODULE_PRIVATE_KEY_BASE64 }}
          MODULE_PUBLIC_KEY_BASE64: ${{ secrets.MODULE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "${MODULE_PRIVATE_KEY_BASE64:-}" ]; then
            printf '%s' "$MODULE_PRIVATE_KEY_BASE64" | base64 --decode > module/private_key
            chmod 600 module/private_key
          fi

          if [ -n "${MODULE_PUBLIC_KEY_BASE64:-}" ]; then
            printf '%s' "$MODULE_PUBLIC_KEY_BASE64" | base64 --decode > module/public_key
            chmod 600 module/public_key
          fi

          if [ -f module/private_key ] && [ ! -f module/public_key ]; then
            echo "::warning::private_key restored but public_key is missing, build will fall back to unsigned output"
          fi

      - name: Build release zip
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew module:zipRelease

      - name: Resolve release metadata
        id: metadata
        run: |
          set -euo pipefail
          zip_path=$(find module/build/outputs/release -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$zip_path" ]; then
            echo "No release zip found" >&2
            exit 1
          fi

          version_name=$(sed -n 's/^version=//p' module/build/outputs/module/release/module.prop | head -n 1)
          version_code=$(sed -n 's/^versionCode=//p' module/build/outputs/module/release/module.prop | head -n 1)
          zip_name=$(basename "$zip_path")
          release_tag="$version_code"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
            release_tag="${GITHUB_REF_NAME}"
          fi

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: ${{ steps.metadata.outputs.version_name }}
          files: ${{ steps.metadata.outputs.zip_path }}

      - name: Checkout main branch for update.json
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Generate update.json
        run: |
          set -euo pipefail
          cat > update.json <<EOF
          {
            "version": "${{ steps.metadata.outputs.version_name }}",
            "versionCode": "${{ steps.metadata.outputs.version_code }}",
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.metadata.outputs.release_tag }}/${{ steps.metadata.outputs.zip_name }}",
            "changelog": "https://github.com/${{ github.repository }}/releases/tag/${{ steps.metadata.outputs.release_tag }}"
          }
          EOF

      - name: Commit update.json
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add update.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update update.json for ${{ steps.metadata.outputs.release_tag }}"
          git push origin main
